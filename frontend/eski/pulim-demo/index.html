<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulim qayerga ketyapti?</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #222; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
  input[type=text] { flex: 2; min-width: 140px; }
  input[type=number] { flex: 1; min-width: 110px; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .total { font-size: 28px; font-weight: bold; }
  .bar-row { margin: 8px 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .bar { height: 14px; background: #e5e7eb; border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; background: #2563eb; border-radius: 7px; }
  .tip { background: #fef9c3; border-left: 4px solid #eab308; padding: 12px; border-radius: 8px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  .del { background: #ef4444; padding: 4px 8px; font-size: 12px; }
  .empty { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pulim qayerga ketyapti?</h1>
  <div class="sub">Xarajatlarni kiriting, tizim qayerga ko'p ketayotganini ko'rsatadi.</div>

  <div class="card">
    <div class="row">
      <input type="text" id="name" placeholder="Nima uchun? (masalan: non)">
      <input type="number" id="amount" placeholder="Summa (so'm)">
      <select id="category">
        <option value="Oziq-ovqat">Oziq-ovqat</option>
        <option value="Transport">Transport</option>
        <option value="Kommunal">Kommunal</option>
        <option value="Kiyim">Kiyim</option>
        <option value="Bozor">Bozor</option>
        <option value="Boshqa">Boshqa</option>
      </select>
      <button onclick="addExpense()">Qo'shish</button>
    </div>
  </div>

  <div class="card">
    <div>Shu oy jami xarajat:</div>
    <div class="total" id="total">0 so'm</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Kategoriyalar bo'yicha</h3>
    <div id="bars"><div class="empty">Hozircha xarajat yo'q.</div></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Tejash tavsiyasi</h3>
    <div class="tip" id="tip">Xarajat kiriting, tavsiya shu yerda chiqadi.</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Oxirgi xarajatlar</h3>
    <table>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem("pulim_expenses") || "[]");

  function save() {
    localStorage.setItem("pulim_expenses", JSON.stringify(expenses));
  }

  function fmt(n) {
    return Math.round(n).toLocaleString("en-US").replace(/,/g, " ") + " so'm";
  }

  function addExpense() {
    const name = document.getElementById("name").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const category = document.getElementById("category").value;
    if (!name || !amount || amount <= 0) {
      alert("Nomi va summani to'g'ri kiriting.");
      return;
    }
    expenses.push({ id: Date.now(), name, amount, category, date: new Date().toISOString().slice(0, 10) });
    save();
    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";
    render();
  }

  function removeExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    save();
    render();
  }

  function render() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    document.getElementById("total").textContent = fmt(total);

    // Kategoriya bo'yicha yig'ish
    const byCat = {};
    expenses.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    const bars = document.getElementById("bars");
    if (cats.length === 0) {
      bars.innerHTML = '<div class="empty">Hozircha xarajat yo\'q.</div>';
    } else {
      bars.innerHTML = cats.map(([cat, sum]) => {
        const pct = total ? Math.round(sum / total * 100) : 0;
        return `<div class="bar-row">
          <div class="bar-label"><span>${cat}</span><span>${fmt(sum)} (${pct}%)</span></div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join("");
    }

    // Tavsiya
    const tip = document.getElementById("tip");
    if (cats.length === 0) {
      tip.textContent = "Xarajat kiriting, tavsiya shu yerda chiqadi.";
    } else {
      const [topCat, topSum] = cats[0];
      const topPct = Math.round(topSum / total * 100);
      const save10 = Math.round(topSum * 0.1);
      tip.textContent = `Eng ko'p pul "${topCat}" ga ketyapti (${topPct}%). Shu toifada 10% tejasangiz, oyiga ${fmt(save10)} qolardi.`;
    }

    // Ro'yxat
    const list = document.getElementById("list");
    const last = [...expenses].reverse().slice(0, 10);
    list.innerHTML = last.length === 0
      ? '<tr><td class="empty">Ro\'yxat bo\'sh.</td></tr>'
      : last.map(e => `<tr>
          <td>${e.date}</td>
          <td>${e.name}</td>
          <td>${e.category}</td>
          <td>${fmt(e.amount)}</td>
          <td><button class="del" onclick="removeExpense(${e.id})">O'chirish</button></td>
        </tr>`).join("");
  }

  render();
</script>
</body>
</html>
